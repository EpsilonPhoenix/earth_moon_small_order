name: Full verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify source and fixed-input checksums
        run: sha256sum -c MANIFEST.sha256

      - name: Prepare fresh verification reports
        id: prepare_reports
        run: |
          mkdir -p "$RUNNER_TEMP/earth-moon-verification"
          # These are generated reports, not the fixed inputs in *_results.json.
          # Remove them so a failed run cannot upload an old success as new evidence.
          rm -f verification.json lean_verification.json \
            computations/arithmetic_results.json computations/*_verification.json

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install verifier dependencies and the Z3 shared library
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libz3-4
          python -m pip install -r requirements.txt
          python -m pip check
          python --version
          dpkg-query -W libz3-4

      - name: Set up Lean from lean-toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          # check_project.py performs the build and axiom audit below.
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Test Lean check runner
        run: |
          python -m unittest -v test_check_lean 2>&1 | \
            tee "$RUNNER_TEMP/earth-moon-verification/checker-tests.log"

      - name: Run every computational check, Lean build, and axiom audit
        run: |
          python check_project.py --require-lean 2>&1 | \
            tee "$RUNNER_TEMP/earth-moon-verification/verification.log"

      - name: Collect reports from this run
        if: ${{ always() && steps.prepare_reports.outcome == 'success' }}
        run: |
          destination="$RUNNER_TEMP/earth-moon-verification"
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$destination/run.txt"
          cp MANIFEST.sha256 requirements.txt lean-toolchain "$destination/"
          for report in verification.json lean_verification.json \
            computations/arithmetic_results.json computations/*_verification.json; do
            if [[ -f "$report" ]]; then
              cp --parents -- "$report" "$destination/"
            fi
          done

      - name: Upload verification reports and logs
        if: ${{ always() && steps.prepare_reports.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/earth-moon-verification/
          if-no-files-found: error
          retention-days: 30
